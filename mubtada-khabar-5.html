<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المبتدأ والخبر</title>
<style>
:root{--bg:#f6f3ec;--pn:#fff;--ink:#1d2a2a;--mut:#5f6b6b;--ln:#ddd6c6;--mb:#0a7b83;--mbs:#d6eef0;--kh:#c2540a;--khs:#fbe4d3;--ok:#1d8a4b;--no:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1a;--pn:#1b2626;--ink:#eaf1f0;--mut:#9bb0ae;--ln:#2f4140;--mb:#4fd1d9;--mbs:#16393c;--kh:#ff9a5c;--khs:#43271a;--ok:#4cd68a;--no:#ff7b6b}}
:root[data-theme="dark"]{--bg:#121a1a;--pn:#1b2626;--ink:#eaf1f0;--mut:#9bb0ae;--ln:#2f4140;--mb:#4fd1d9;--mbs:#16393c;--kh:#ff9a5c;--khs:#43271a;--ok:#4cd68a;--no:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic","Segoe UI",Tahoma,serif;font-size:1.05rem;line-height:1.9}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;margin:6px 0}
h2{font-size:1.15rem;margin:0 0 6px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;margin-bottom:10px}
nav button{flex:1 1 auto;white-space:nowrap}
button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);cursor:pointer;min-height:44px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--mb);outline-offset:2px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.sent{font-size:1.7rem;line-height:2.2;text-align:center;margin:8px 0}
.m{background:var(--mbs);color:var(--mb);border-radius:8px;padding:0 8px;font-weight:700}
.k{background:var(--khs);color:var(--kh);border-radius:8px;padding:0 8px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1;min-width:90px}
.note{color:var(--mut);font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chip{font-size:1.5rem;padding:4px 14px;border:2px solid var(--ln);border-radius:10px;background:var(--pn)}
.chip.m{border-color:var(--mb)}.chip.k{border-color:var(--kh)}
.res{padding:10px;border-radius:8px;margin-top:10px;background:var(--bg)}
.good{color:var(--ok);font-weight:700}.bad{color:var(--no);font-weight:700}
.opt{display:block;width:100%;text-align:right;margin-top:6px}
.opt.right{border-color:var(--ok);background:var(--mbs)}.opt.wrong{border-color:var(--no)}
.bub{max-width:90%;padding:8px 12px;border-radius:14px;margin:8px 0;border:1px solid var(--ln);font-size:1.1rem;line-height:1.8}
.bub.npc{background:var(--pn);margin-inline-end:auto}
.bub.me{background:var(--mbs);margin-inline-start:auto}
.bub small{color:var(--mut)}
.meter{color:var(--kh);letter-spacing:2px}
#stage svg{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--ln);margin:8px 0}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.ball{animation:bn .8s ease-in-out infinite}
.pop{animation:pop .4s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}
@keyframes bl{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes tk{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1.1)}}
@keyframes gs{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
@keyframes nd{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
.br{animation:br 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.blink{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:50% 50%}
.talk{animation:tk .28s infinite;transform-box:fill-box;transform-origin:50% 50%}
.gest{animation:gs 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 0%}
.nod{animation:nd .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){.ball,.pop,.br,.blink,.talk,.gest,.nod{animation:none}}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>المبتدأ والخبر</h1>
<p class="note" style="margin:0 0 10px">الجملة الاسمية: تبدأ باسم مرفوع هو <span class="m">المبتدأ</span> ويتمّ معناها بـ <span class="k">الخبر</span>.</p>
<nav id="tabs" role="tablist"></nav>

<section id="t0"></section>
<section id="t1" class="hide"></section>
<section id="t2" class="hide"></section>
<section id="t3" class="hide"></section>
<section id="t4" class="hide"></section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
window.onerror=function(m,u,l){var b=document.getElementById('err');if(!b){b=document.createElement('div');b.id='err';b.style.cssText='background:#c0392b;color:#fff;padding:8px;margin:8px 0;border-radius:8px;font-size:.85rem;direction:ltr';document.querySelector('main').insertBefore(b,document.querySelector('main').firstChild)}b.textContent='Error: '+m+' (line '+l+')'};
function shuf(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
var names=["الشرح","حلّل الجملة","مختبر المطابقة","اختبر نفسك","قصة المكتبة"];
names.forEach(function(n,i){var b=document.createElement('button');b.textContent=n;b.setAttribute('role','tab');b.onclick=function(){show(i)};b.id='tb'+i;$('tabs').appendChild(b)});
function show(i){stopAll();who=null;for(var j=0;j<5;j++){$('t'+j).classList.toggle('hide',j!==i);$('tb'+j).classList.toggle('on',j===i)}}
function sp(c,t){return '<span class="'+c+'">'+t+'</span>'}

/* ---------- 1) الشرح ---------- */
var MT=[
["اسم ظاهر",sp('m','الصدقُ')+' '+sp('k','منجاةٌ'),"الأصل في المبتدأ أن يكون اسمًا ظاهرًا مرفوعًا."],
["ضمير منفصل",sp('m','هو')+' '+sp('k','مجتهدٌ'),"الضمائر المنفصلة: أنا، نحن، أنتَ، هو، هي، هم... مبنية في محل رفع مبتدأ."],
["اسم إشارة",sp('m','هذا')+' '+sp('k','كتابٌ'),"اسم الإشارة مبني في محل رفع مبتدأ."],
["اسم موصول",sp('m','الذي')+' يجتهدُ '+sp('k','ناجحٌ'),"الاسم الموصول مبني في محل رفع مبتدأ، وجملة الصلة لا محل لها من الإعراب."]];
var KT=[
["مفرد",sp('m','الطالبُ')+' '+sp('k','مجتهدٌ'),"الخبر المفرد ما ليس جملة ولا شبه جملة، وهو مرفوع."],
["جملة اسمية",sp('m','الحديقةُ')+' '+sp('k','أزهارُها جميلةٌ'),"الجملة الاسمية في محل رفع خبر."],
["جملة فعلية",sp('m','الولدُ')+' '+sp('k','يكتبُ الدرسَ'),"الجملة الفعلية في محل رفع خبر."],
["شبه جملة",sp('m','الكتابُ')+' '+sp('k','على الطاولةِ'),"الجار والمجرور أو الظرف، ويتعلقان بمحذوف تقديره (موجود/كائن) خبر المبتدأ."]];
function explorer(id,title,data){
 var h='<div class="card"><h2>'+title+'</h2><div class="row" id="'+id+'b"></div><div class="sent" id="'+id+'s"></div><div class="note" id="'+id+'n"></div></div>';
 return {html:h,init:function(){data.forEach(function(d,i){var b=document.createElement('button');b.textContent=d[0];b.onclick=function(){pick(i)};$(id+'b').appendChild(b)});
  function pick(i){[].forEach.call($(id+'b').children,function(c,j){c.classList.toggle('on',i===j)});$(id+'s').innerHTML=data[i][1];$(id+'n').textContent=data[i][2]}pick(0)}}
}
var e1=explorer('mt','أنواع المبتدأ',MT),e2=explorer('kt','أنواع الخبر',KT);
$('t0').innerHTML='<div class="card"><h2>القاعدة</h2><p style="margin:0">كلٌّ من المبتدأ والخبر <b>مرفوع</b>. علامات الرفع: الضمة في المفرد وجمع التكسير وجمع المؤنث السالم، والألف في المثنى، والواو في جمع المذكر السالم.</p><p class="sent">'+sp('m','العلمُ')+' '+sp('k','نورٌ')+'</p><p class="note" style="margin:0">الخبر يطابق المبتدأ في النوع (مذكر/مؤنث) والعدد (مفرد/مثنى/جمع) إذا كان مفردًا. جرّب ذلك في «مختبر المطابقة».</p></div>'+e1.html+e2.html;
e1.init();e2.init();

/* ---------- 2) حلّل الجملة ---------- */
var S=[
{w:["العِلمُ","نورٌ"],m:[0],k:[1],t:"خبر مفرد",e:"العلمُ: مبتدأ مرفوع وعلامة رفعه الضمة. نورٌ: خبر مرفوع وعلامة رفعه الضمة."},
{w:["الطالبانِ","مجتهدانِ"],m:[0],k:[1],t:"خبر مفرد",e:"الطالبانِ: مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى. مجتهدانِ: خبر مرفوع وعلامة رفعه الألف لأنه مثنى."},
{w:["المؤمنونَ","صادقونَ"],m:[0],k:[1],t:"خبر مفرد",e:"المؤمنونَ: مبتدأ مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم. صادقونَ: خبر مرفوع وعلامة رفعه الواو."},
{w:["هذا","كتابٌ"],m:[0],k:[1],t:"خبر مفرد",e:"هذا: اسم إشارة مبني على السكون في محل رفع مبتدأ. كتابٌ: خبر مرفوع وعلامة رفعه الضمة."},
{w:["المعلمُ","في","الصفِّ"],m:[0],k:[1,2],t:"خبر شبه جملة",e:"المعلمُ: مبتدأ مرفوع. في الصفِّ: جار ومجرور متعلقان بمحذوف خبر المبتدأ."},
{w:["الحديقةُ","أزهارُها","جميلةٌ"],m:[0],k:[1,2],t:"خبر جملة اسمية",e:"الحديقةُ: مبتدأ أول. أزهارُها جميلةٌ: جملة اسمية (مبتدأ ثانٍ وخبره) في محل رفع خبر المبتدأ الأول."},
{w:["الولدُ","يكتبُ","الدرسَ"],m:[0],k:[1,2],t:"خبر جملة فعلية",e:"الولدُ: مبتدأ مرفوع. يكتبُ الدرسَ: جملة فعلية في محل رفع خبر."},
{w:["الصدقُ","يهدي","إلى","البرِّ"],m:[0],k:[1,2,3],t:"خبر جملة فعلية",e:"الصدقُ: مبتدأ مرفوع. يهدي إلى البرِّ: جملة فعلية في محل رفع خبر."}];
var si=0,mode='m',sel,done;
$('t1').innerHTML='<div class="card"><h2>حدّد المبتدأ والخبر</h2><p class="note" style="margin:0">اختر الدور ثم المس الكلمات. المس الكلمة مرة أخرى لإلغائها.</p><div class="row" style="margin-top:8px"><button id="bm" class="on">المبتدأ</button><button id="bk">الخبر</button></div><div class="chips" id="ch"></div><div class="row"><button id="ck">تحقق</button><button id="nx">الجملة التالية</button></div><div class="res hide" id="rs"></div></div>';
function load(){sel={m:[],k:[]};done=false;$('rs').classList.add('hide');draw()}
function draw(){var c=$('ch');c.innerHTML='';S[si].w.forEach(function(w,i){var b=document.createElement('button');b.className='chip'+(sel.m.indexOf(i)>-1?' m':sel.k.indexOf(i)>-1?' k':'');b.textContent=w;b.onclick=function(){if(done)return;var o=mode==='m'?'k':'m';sel[o]=sel[o].filter(function(x){return x!==i});var p=sel[mode].indexOf(i);if(p>-1)sel[mode].splice(p,1);else sel[mode].push(i);draw()};c.appendChild(b)})}
function same(a,b){return a.length===b.length&&a.every(function(x){return b.indexOf(x)>-1})}
$('bm').onclick=function(){mode='m';$('bm').classList.add('on');$('bk').classList.remove('on')};
$('bk').onclick=function(){mode='k';$('bk').classList.add('on');$('bm').classList.remove('on')};
$('ck').onclick=function(){var s=S[si],ok=same(sel.m,s.m)&&same(sel.k,s.k);done=true;
 var r=$('rs');r.classList.remove('hide');
 r.innerHTML=(ok?'<span class="good">أحسنت، إجابة صحيحة.</span>':'<span class="bad">راجع الإجابة. الصحيح موضّح بالألوان.</span>')+'<br><b>النوع:</b> '+s.t+'<br>'+s.e;
 sel={m:s.m.slice(),k:s.k.slice()};draw()};
$('nx').onclick=function(){si=(si+1)%S.length;load()};
load();

/* ---------- 3) مختبر المطابقة ---------- */
var L=[
["المعلمُ","مجتهدٌ","مفرد مذكر","الضمة"],["المعلمةُ","مجتهدةٌ","مفرد مؤنث","الضمة"],
["المعلمانِ","مجتهدانِ","مثنى مذكر","الألف"],["المعلمتانِ","مجتهدتانِ","مثنى مؤنث","الألف"],
["المعلمونَ","مجتهدونَ","جمع مذكر سالم","الواو"],["المعلماتُ","مجتهداتٌ","جمع مؤنث سالم","الضمة"]];
$('t2').innerHTML='<div class="card"><h2>اختر المبتدأ وانظر كيف يتغير الخبر</h2><div class="row" id="lb"></div><div class="sent" id="ls"></div><div class="res" id="lr"></div></div>';
L.forEach(function(d,i){var b=document.createElement('button');b.textContent=d[0];b.onclick=function(){lp(i)};$('lb').appendChild(b)});
function lp(i){var d=L[i];[].forEach.call($('lb').children,function(c,j){c.classList.toggle('on',i===j)});
 $('ls').innerHTML=sp('m',d[0])+' '+sp('k',d[1]);
 $('lr').innerHTML='المبتدأ والخبر هنا: <b>'+d[2]+'</b>.<br><b>الإعراب:</b> '+d[0]+': مبتدأ مرفوع وعلامة رفعه '+d[3]+'. '+d[1]+': خبر مرفوع وعلامة رفعه '+d[3]+'.'}
lp(0);

/* ---------- 4) اختبر نفسك ---------- */
var Q=[
["ما نوع الخبر في: الطالبُ يقرأُ الكتابَ؟",["مفرد","جملة اسمية","جملة فعلية","شبه جملة"],2],
["ما علامة رفع المبتدأ في: المعلمانِ حاضرانِ؟",["الضمة","الألف","الواو","الياء"],1],
["أي الجمل الآتية مطابقة؟",["الطالباتُ مجتهدونَ","الطالباتُ مجتهداتٌ","الطالبانِ مجتهدٌ"],1],
["الخبر في: الكتابُ على الطاولةِ هو:",["مفرد","جملة فعلية","شبه جملة","جملة اسمية"],2],
["حكم المبتدأ الإعرابي دائمًا:",["مرفوع","منصوب","مجرور","مجزوم"],0],
["إعراب (هذا) في: هذا كتابٌ:",["مبتدأ مبني في محل رفع","فاعل","خبر","مفعول به"],0],
["نوع الخبر في: الحديقةُ أزهارُها جميلةٌ:",["مفرد","جملة اسمية","جملة فعلية","شبه جملة"],1],
["علامة رفع (المسلمونَ) في: المسلمونَ إخوةٌ:",["الضمة","الألف","الواو","الفتحة"],2]];
var qi=0,score=0;
function qd(){var box=$('t3');
 if(qi>=Q.length){box.innerHTML='<div class="card"><h2>النتيجة: '+score+' من '+Q.length+'</h2><p>'+(score>=7?'ممتاز، أتقنتَ الدرس.':score>=5?'جيد، راجع أنواع الخبر ثم أعد المحاولة.':'أعد قراءة الشرح ثم حاول مجددًا.')+'</p><button id="rq">إعادة الاختبار</button></div>';$('rq').onclick=function(){qi=0;score=0;qd()};return}
 var q=Q[qi];box.innerHTML='<div class="card"><p class="note" style="margin:0">السؤال '+(qi+1)+' من '+Q.length+'</p><h2>'+q[0]+'</h2><div id="qo"></div><div class="res hide" id="qf"></div></div>';
 shuf(q[1].length).forEach(function(i){var o=q[1][i],b=document.createElement('button');b.className='opt';b.textContent=o;b.setAttribute('data-i',i);b.onclick=function(){
  [].forEach.call($('qo').children,function(c){c.disabled=true;if(+c.getAttribute('data-i')===q[2])c.classList.add('right')});
  var ok=i===q[2];if(ok)score++;else b.classList.add('wrong');
  var f=$('qf');f.classList.remove('hide');f.innerHTML='<span class="'+(ok?'good':'bad')+'">'+(ok?'صحيح':'خطأ، الصواب: '+q[1][q[2]])+'</span><br><button id="qn" style="margin-top:8px">التالي</button>';
  $('qn').onclick=function(){qi++;qd()}};$('qo').appendChild(b)})}
qd();

/* ---------- 5) قصة المكتبة ---------- */
function T(a,b){return '<span class="m">'+a+'</span> <span class="k">'+b+'</span>'}
var SC=[
{n:"أهلًا بك يا يوسف! جئتَ مبكرًا اليوم. كيف ترى المكتبة الآن؟",c:"تريد أن تصف المكتبة بأنها هادئة.",t:T('المكتبةُ','{}'),o:["هادئةٌ","هادئٌ","هادئينَ","هادئةً"],a:0,w:"الخبر المفرد يطابق المبتدأ (المكتبة: مفرد مؤنث) ويكون مرفوعًا بالضمة: هادئةٌ.",g:"وصفٌ دقيق، فالمكتبة هادئة فعلًا.",b:"لم يتضح لي قصدك تمامًا، لكن فلنتابع."},
{n:"أرى ولدين عند النافذة. ماذا يفعلان؟",c:"تقول إن الولدين يلعبان (خبر جملة فعلية).",t:T('الولدانِ','{}'),o:["يلعبانِ","يلعبُ","يلعبنَ","يلعبونَ"],a:0,w:"الفعل المسند إلى المثنى المذكر يكون: يلعبانِ، والجملة الفعلية في محل رفع خبر.",g:"نعم، يلعبان بهدوء.",b:"همم، الفعل لا يناسب الولدين. فلنتابع."},
{n:"وأين يلعبان؟",c:"تقول إنهما في الساحة (خبر شبه جملة).",t:T('الولدانِ','{}'),o:["في الساحةِ","في الساحةُ","في الساحةَ","على الساحةُ"],a:0,w:"الجار والمجرور شبه جملة خبر، والاسم بعد حرف الجر مجرور: في الساحةِ.",g:"فهمتُ، إنهما في الساحة.",b:"لم أفهم جيدًا أين هما. فلنتابع."},

 bub('me','<small>يوسف</small><br>'+s.t.replace('{}',s.o[i]));
 bub('npc','<small>الأستاذ سامي</small><br>'+(ok?s.g:s.b));
 $('act').innerHTML='<div class="res"><span class="'+(ok?'good':'bad')+'">'+(ok?'اختيار صحيح':'اختيار غير مناسب')+'</span>'+(ok?'':'<br><b>الصواب:</b> '+s.t.replace('{}',s.o[s.a]))+'<br>'+s.w+'</div><button class="opt on" id="nx2">'+(sc===SC.length-1?'النهاية':'التالي')+'</button>';
 $('nx2').onclick=function(){sc++;scene()}}
function fin(){stage(7,pts>=4?'h':'n',pts>=4?'h':'c',pts>=7?'t':'b');var t=pts>=7?'أحسنتَ يا يوسف! فزتَ بلقب سفير القراءة.':pts>=4?'حصلتَ على المركز الثاني. راجع ما أخطأتَ فيه لتفوز في المرة القادمة.':'شاركتَ وتعلمتَ الكثير، لكنك تحتاج إلى مراجعة المبتدأ والخبر. عد إلى الشرح ثم أعد القصة.';
 speak(t+' نتيجتك '+pts+' من '+SC.length,'t',1);if(pts>=4)good();else bad();bub('npc','<small>الراوي</small><br>'+t+'<br>نتيجتك: '+pts+' من '+SC.length);
 $('act').innerHTML='<button class="opt on" id="rp">أعد القصة</button>';$('rp').onclick=intro}

show(0);
